# DNS
dns:
  enable: true
  enable-cache: true
  cache-size: 8192
  listen: 0.0.0.0:7874          # 改为 IPv4，避免与 ipv6: false 冲突
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16  # 改为网络地址 .0.0
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '*.synology.com'           # 确保你的群晖相关所有服务不用 FakeIP
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'geosite:cn'               # 新版 mihomo 支持一键过滤整个中国的已知域名(防止偶发国内名单漏网的情况)
    - '+.gigolo21.top'
    - '+.ggff.net'
    - '+.pypi.org'
    - '+.mirrors.ustc.edu.cn'
    - 'geosite:tencent'      # 新增：强制跳过所有腾讯域名
    - '+.qq.com'             # 新增：显式包含
    - '+.tencent.com'        # 新增
    - '+.gtimg.cn'           # 新增
    - '+.gcloudsvcs.com'     # 新增
    - '+.tencent-cloud.net'  # 新增
    - '+.cloudflare.com'  # 新增
    - '+.weixin.com'
    - '+.tenpay.com'
    - '+.stun.*.*'
    - '+.wegame.com.cn'
    - '+.wegame.gtimg.com'
    - '+.lol.qq.com'
    - '+.riotgames.com'
    - '+.igamecj.com'
    - '+.lobehub.com'
  fake-ip-filter-mode: blacklist
  respect-rules: true
  prefer-h3: false
  use-system-hosts: true
  use-hosts: false 
  
  # 注意：Mihomo 现已大量使用 nameserver-policy 进行精准分发，可取代繁琐的老结构
  default-nameserver:
    - 127.0.0.1:6053
    - 127.0.0.1:6053
  
  proxy-server-nameserver:
  #  - 192.168.6.238
    - 127.0.0.1:6053
  # - 223.6.6.6

  
  direct-nameserver:
  #  - 192.168.6.238               # NAS 的 53 端口处理必须直连的查询
    - 127.0.0.1:6053

# 【第三层防漏：核心防隐私泄漏】：默认全局 DNS。
  # 只要没有在下方 policy 明确标为“国内”的域名，全部被视为“海外/未知域名”。
  # 这些请求将全部走加密的 HTTPS DNS，运营商无法偷窥，彻底防止 DNS 污染和泄漏！
  nameserver:
    - https://dns.qxx21.ggff.net/dns-query/aixi21
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
#     - https://hk.pms.loc.cc/dohgo
#     - https://runtime.webn.cc:2083/dnsgo
#     - 192.168.6.238:5302  
# 【第四层防漏：核心防 CDN 绕路】：精准分流策略。
  # 明确知道是国内的域名，才发给你内网的 ADH (192.168.6.238)。
  # 这样 LOL 和国内网站就能拿到最快的国内节点 IP。
  nameserver-policy:
    "+.gigolo21.top":
      - 127.0.0.1:6053
    "+.synology.com":
      - 127.0.0.1:6053 # 修改：群晖官方域名走国内 DNS，避免连接异常
      - 127.0.0.1:6053
    "geosite:cn":
#      - 192.168.6.238
      - 127.0.0.1:6053
    "geosite:tencent":
#      - 192.168.6.238
      - 127.0.0.1:6053
    "+.qq.com":
#      - 192.168.6.238
      - 127.0.0.1:6053
    "+.tencent.com":
#      - 192.168.6.238
      - 127.0.0.1:6053
    "+.wegame.com.cn":
#      - 192.168.6.238
      - 127.0.0.1:6053
    "+.wegame.gtimg.com":
#      - 192.168.6.238
      - 127.0.0.1:6053
    "+.lol.qq.com":
#      - 192.168.6.238
      - 127.0.0.1:6053
    "+.riotgames.com":
#      - 192.168.6.238
      - 127.0.0.1:6053
    "+.igamecj.com":
#      - 192.168.6.238
      - 127.0.0.1:6053

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
#    QUIC:
#      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"
    - "192.168.6.1"      # 注意：skip-domain 通常用于域名，IP建议用 skip-src-ip
    - "192.168.6.238"
    - "+.qq.com"             # 新增
    - "+.tencent.com"        # 新增
    - "+.gtimg.cn"           # 新增
    - "+.tencent-cloud.net"
    - "+.weixin.com" # 修改：微信相关跳过嗅探，减少兼容性问题
    - "+.tenpay.com" # 修改：支付相关跳过嗅探，减少兼容性问题
    - "+.wegame.com.cn" # 修改：游戏相关跳过嗅探，降低延迟尖刺
    - "+.lol.qq.com" # 修改：游戏相关跳过嗅探，降低延迟尖刺
    - "geosite:cn"
tun:
  enable: true
  stack: mixed           # 内核协议栈（如果性能不够可改为 gvisor）
  device: mihomo          # 创建的虚拟网卡名称
  auto-route: false        # 自动配置路由表（关键！彻底解决 Fake-IP 路由黑洞）
  auto-detect-interface: false
  dns-hijack:
    - any:53              # 强制劫持局域网内的 53 端口 DNS 请求
